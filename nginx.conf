server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # Imagens e ícones podem ficar em cache longo (troque o nome do arquivo ao atualizar)
    location ~* \.(webp|jpg|jpeg|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # O HTML sempre revalida, para que edições apareçam na hora
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
